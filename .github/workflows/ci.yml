name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lacquer
          POSTGRES_PASSWORD: lacquer_dev
          POSTGRES_DB: lacquer_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U lacquer -d lacquer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://lacquer:lacquer_dev@localhost:5432/lacquer_test
      TEST_DATABASE_URL: postgresql://lacquer:lacquer_dev@localhost:5432/lacquer_test
      REDIS_URL: redis://localhost:6379
      TEST_REDIS_URL: redis://localhost:6379/15
      APP_URL: http://localhost:5173
      ORIGIN: http://localhost:5173
      PORT: 5173
      API_INTERNAL_URL: http://127.0.0.1:3001
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
